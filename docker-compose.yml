services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: audio_notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-audio_notes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-audio_notes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Durable Job Queue
  redis:
    image: redis:7-alpine
    container_name: audio_notes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_notes_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-audio_notes}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  # 3b. Durable background worker (consumes Redis queue; same image, worker entrypoint)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_notes_worker
    restart: unless-stopped
    command: ["python", "scripts/worker.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-audio_notes}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads

  # 4. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audio_notes_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side pre-render calls backend directly (browser still uses same-origin /api/*).
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

  # 5. App Nginx (internal routing: /api/* -> backend, docs/health, / -> frontend).
  # No host ports — Nginx Proxy Manager (below) owns 80/443 and forwards
  # harsh-shah.me to this service over the compose network.
  nginx:
    image: nginx:alpine
    container_name: audio_notes_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # 6. Nginx Proxy Manager — public entrypoint for harsh-shah.me.
  # Admin UI on http://<server-ip>:81 (default admin@example.com/changeme).
  # Create Proxy Host: harsh-shah.me -> forward to hostname `nginx`, port 80,
  # Websockets ON, then SSL -> Request Let's Encrypt certificate, Force SSL.
  npm:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: audio_notes_npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_ssl:/etc/letsencrypt
    depends_on:
      - nginx

volumes:
  postgres_data:
  backend_uploads:
  npm_data:
  npm_ssl:
